<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="glow">NEON TIC-TAC-TOE</h1>
        
        <div id="scoreBoard">
            <div class="score-box">PLAYER X <br><span id="scoreX" class="score-num">0</span></div>
            <div class="score-box">PLAYER O <br><span id="scoreO" class="score-num">0</span></div>
        </div>
        
        <h2 id="statusText">SYSTEM READY: Player X</h2>
        
        <div id="gameBoard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="restartBtn">SYSTEM REBOOT</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
